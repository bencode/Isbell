[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
isbell-proto = { path = "crates/isbell-proto" }
isbell-relay = { path = "crates/isbell-relay" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
data-encoding = "2"
ed25519-dalek = "3"
futures-util = "0.3"
gethostname = "1"
hkdf = "0.13"
plist = "1"
rand = "0.10"
redis = { version = "1.7", features = ["tokio-comp", "connection-manager", "script"] }
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "0.21"
