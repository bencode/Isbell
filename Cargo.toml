[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
isbell-proto = { path = "crates/isbell-proto" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
data-encoding = "2"
ed25519-dalek = "3"
futures-util = "0.3"
hkdf = "0.13"
rand = "0.10"
redis = { version = "1.7", features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
