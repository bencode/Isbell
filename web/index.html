<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isbell</title>
    <script>
      // Apply the chosen theme before the first paint; "system" leaves it to the media query.
      try {
        const theme = JSON.parse(localStorage.getItem('isbell.prefs') || '{}').theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (err) {
        console.warn('could not read the theme', err)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
