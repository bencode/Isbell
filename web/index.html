<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Isbell</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f0e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10151f" />
    <!-- Opened from a phone's home screen: full screen, under its own name. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Isbell" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the chosen theme before the first paint; "system" leaves it to the media query.
      try {
        const theme = JSON.parse(localStorage.getItem('isbell.prefs') || '{}').theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (err) {
        console.warn('could not read the theme', err)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
